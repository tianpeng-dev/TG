name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 18.18.0
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm lint
      - run: pnpm type-check
