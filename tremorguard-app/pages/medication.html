    <title>用药管理 - TremorGuard</title>
    <style id="theme-vars">
/* TremorGuard Brand Design System
   Healthcare-grade accessible design for Parkinson's patients
   Prefix: tg */

:root {
  /* ---- Primary Palette ---- */
  --tg-primary: #0F766E;
  --tg-primary-foreground: #FFFFFF;
  --tg-primary-light: #14B8A6;

  /* ---- Semantic State Colors ---- */
  --state-success: #059669;
  --state-success-foreground: #FFFFFF;
  --state-success-light: #ECFDF5;
  --state-warning: #D97706;
  --state-warning-foreground: #FFFFFF;
  --state-warning-light: #FFFBEB;
  --state-error: #DC2626;
  --state-error-foreground: #FFFFFF;
  --state-error-light: #FEF2F2;
  --state-info: #0891B2;
  --state-info-foreground: #FFFFFF;
  --state-info-light: #ECFEFF;

  /* ---- Neutral Scale ---- */
  --tg-neutral-50: #F8F9FB;
  --tg-neutral-100: #F1F3F5;
  --tg-neutral-200: #E5E7EB;
  --tg-neutral-300: #D1D5DB;
  --tg-neutral-400: #9CA3AF;
  --tg-neutral-500: #6B7280;
  --tg-neutral-600: #4B5563;
  --tg-neutral-700: #374151;
  --tg-neutral-800: #1F2937;
  --tg-neutral-900: #1A1D23;

  /* ---- Surface / Card Colors ---- */
  --tg-background: #F8F9FB;
  --tg-foreground: #1A1D23;
  --tg-card: #FFFFFF;
  --tg-card-foreground: #1A1D23;
  --tg-muted: #F1F3F5;
  --tg-muted-foreground: #6B7280;
  --tg-popover: #FFFFFF;
  --tg-popover-foreground: #1A1D23;
  --tg-border: #E5E7EB;
  --tg-input: #E5E7EB;
  --tg-ring: #0F766E;

  /* ---- Message Bubble Colors ---- */
  --tg-msg-system: #F0FDFA;
  --tg-msg-user: #ECFEFF;
  --tg-msg-alert: #FFFBEB;
  --tg-msg-confirmed: #ECFDF5;

  /* ---- Radius Scale ---- */
  --tg-radius-sm: 6px;
  --tg-radius-md: 12px;
  --tg-radius-lg: 16px;
  --tg-radius-full: 9999px;

  /* ---- Spacing ---- */
  --tg-spacing-xs: 4px;
  --tg-spacing-sm: 8px;
  --tg-spacing-md: 12px;
  --tg-spacing-lg: 16px;
  --tg-spacing-xl: 20px;
  --tg-spacing-2xl: 24px;

  /* ---- Typography ---- */
  --tg-font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --tg-font-mono: 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace;

  --tg-text-xs: 14px;
  --tg-text-sm: 16px;
  --tg-text-base: 18px;
  --tg-text-lg: 20px;
  --tg-text-xl: 24px;
  --tg-text-2xl: 28px;
  --tg-text-3xl: 32px;

  --tg-leading-tight: 1.3;
  --tg-leading-normal: 1.5;
  --tg-leading-relaxed: 1.7;

  --tg-weight-regular: 400;
  --tg-weight-medium: 500;
  --tg-weight-semibold: 600;
  --tg-weight-bold: 700;

  /* ---- Shadows (static: alpha <= 0.05; floating layers may exceed) ---- */
  --tg-shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --tg-shadow-md: 0 2px 8px rgba(0,0,0,0.05);
  --tg-shadow-floating: 0 8px 24px rgba(0,0,0,0.08);
  --tg-shadow-overlay: 0 16px 48px rgba(0,0,0,0.12);

  /* ---- Semantic Aliases for apply-html-head-contract ---- */
  --tg-background: #F8F9FB;
  --tg-foreground: #1A1D23;
  --tg-card: #FFFFFF;
  --tg-card-foreground: #1A1D23;
  --tg-popover: #FFFFFF;
  --tg-popover-foreground: #1A1D23;
  --tg-primary: #0F766E;
  --tg-primary-foreground: #FFFFFF;
  --tg-muted: #F1F3F5;
  --tg-muted-foreground: #6B7280;
  --tg-border: #E5E7EB;
  --tg-input: #E5E7EB;
  --tg-ring: #0F766E;
  --tg-radius-sm: 6px;
  --tg-radius-md: 12px;
  --tg-radius-lg: 16px;
  --tg-radius-full: 9999px;
}

/* ---- Typography Scale ---- */
.tg-text-xs { font-size: var(--tg-text-xs); line-height: var(--tg-leading-normal); font-weight: var(--tg-weight-regular); }
.tg-text-sm { font-size: var(--tg-text-sm); line-height: var(--tg-leading-normal); font-weight: var(--tg-weight-regular); }
.tg-text-base { font-size: var(--tg-text-base); line-height: var(--tg-leading-normal); font-weight: var(--tg-weight-regular); }
.tg-text-lg { font-size: var(--tg-text-lg); line-height: var(--tg-leading-tight); font-weight: var(--tg-weight-bold); }
.tg-text-xl { font-size: var(--tg-text-xl); line-height: var(--tg-leading-tight); font-weight: var(--tg-weight-bold); }

.tg-font-medium { font-weight: var(--tg-weight-medium); }
.tg-font-semibold { font-weight: var(--tg-weight-semibold); }
.tg-font-bold { font-weight: var(--tg-weight-bold); }

    </style>

<body>

  <!-- Status Bar Spacer -->
  <div class="status-bar-spacer"></div>

  <!-- Top Navigation -->
  <div class="top-nav">
    <div style="display:flex; align-items:center; padding:12px var(--tg-spacing-lg); gap:var(--tg-spacing-lg);">
      <!-- Back Arrow -->
      <div style="width:48px; height:48px; display:flex; align-items:center; justify-content:center; cursor:pointer; -webkit-tap-highlight-color:transparent; flex-shrink:0;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--tg-foreground)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18L9 12L15 6"/>
        </svg>
      </div>
      <!-- Title -->
      <div style="flex:1; text-align:center; font-size:var(--tg-text-lg); font-weight:var(--tg-weight-bold);">
        用药管理
      </div>
      <!-- Right spacer for centering -->
      <div style="width:48px; flex-shrink:0;"></div>
    </div>
  </div>

  <!-- Page Content -->
  <div class="page-content" style="margin-top:var(--tg-spacing-lg);">

    <!-- Progress Card -->
    <div class="progress-card">
      <div style="font-size:var(--tg-text-sm); color:var(--tg-muted-foreground); font-weight:var(--tg-weight-medium);">今日用药进度</div>
      <div class="progress-ring-container">
        <svg width="120" height="120" viewBox="0 0 120 120">
          <circle class="progress-ring-bg" cx="60" cy="60" r="50"/>
          <circle class="progress-ring-fg" cx="60" cy="60" r="50"/>
        </svg>
        <div class="progress-ring-text">
          <div style="font-size:var(--tg-text-xl); font-weight:var(--tg-weight-bold); color:var(--tg-primary); line-height:1;">3/5</div>
        </div>
      </div>
    </div>

    <!-- Medication Item 1: Taken -->
    <div class="medication-card">
      <div style="display:flex; align-items:baseline; gap:8px; margin-bottom:8px;">
        <span style="font-size:var(--tg-text-base); font-weight:var(--tg-weight-bold); color:var(--tg-foreground);">左旋多巴</span>
        <span style="font-size:var(--tg-text-sm); color:var(--tg-muted-foreground);">250mg</span>
      </div>
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <span style="font-size:var(--tg-text-sm); color:var(--tg-muted-foreground);">08:00</span>
        <span class="status-badge status-taken">已服用</span>
      </div>
    </div>

    <!-- Medication Item 2: Taken -->
    <div class="medication-card">
      <div style="display:flex; align-items:baseline; gap:8px; margin-bottom:8px;">
        <span style="font-size:var(--tg-text-base); font-weight:var(--tg-weight-bold); color:var(--tg-foreground);">恩他卡朋</span>
        <span style="font-size:var(--tg-text-sm); color:var(--tg-muted-foreground);">200mg</span>
      </div>
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <span style="font-size:var(--tg-text-sm); color:var(--tg-muted-foreground);">08:00</span>
        <span class="status-badge status-taken">已服用</span>
      </div>
    </div>

    <!-- Medication Item 3: Taken -->
    <div class="medication-card">
      <div style="display:flex; align-items:baseline; gap:8px; margin-bottom:8px;">
        <span style="font-size:var(--tg-text-base); font-weight:var(--tg-weight-bold); color:var(--tg-foreground);">普拉克索</span>
        <span style="font-size:var(--tg-text-sm); color:var(--tg-muted-foreground);">0.5mg</span>
      </div>
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <span style="font-size:var(--tg-text-sm); color:var(--tg-muted-foreground);">12:00</span>
        <span class="status-badge status-taken">已服用</span>
      </div>
    </div>

    <!-- Medication Item 4: Pending -->
    <div class="medication-card">
      <div style="display:flex; align-items:baseline; gap:8px; margin-bottom:8px;">
        <span style="font-size:var(--tg-text-base); font-weight:var(--tg-weight-bold); color:var(--tg-foreground);">左旋多巴</span>
        <span style="font-size:var(--tg-text-sm); color:var(--tg-muted-foreground);">250mg</span>
      </div>
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <span style="font-size:var(--tg-text-sm); color:var(--tg-muted-foreground);">18:00</span>
        <span class="status-badge status-pending">待服用</span>
      </div>
    </div>

    <!-- Medication Item 5: Skipped -->
    <div class="medication-card">
      <div style="display:flex; align-items:baseline; gap:8px; margin-bottom:8px;">
        <span style="font-size:var(--tg-text-base); font-weight:var(--tg-weight-bold); color:var(--tg-foreground);">恩他卡朋</span>
        <span style="font-size:var(--tg-text-sm); color:var(--tg-muted-foreground);">200mg</span>
      </div>
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <span style="font-size:var(--tg-text-sm); color:var(--tg-muted-foreground);">14:00</span>
        <span class="status-badge status-skipped">已跳过</span>
      </div>
    </div>

  </div>

  <!-- Floating Bottom Button -->
  <button class="floating-btn">+ 添加用药计划</button>


    <style>
    body {
      background: var(--tg-background);
      min-height: 100vh;
      font-family: var(--tg-font-sans);
      color: var(--tg-foreground);
      -webkit-font-smoothing: antialiased;
      max-width: 100%;
      margin: 0;
      position: relative;
      overflow-x: hidden;
    }
    .status-bar-spacer {
      height: 44px;
      width: 100%;
      flex-shrink: 0;
    }
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--tg-card);
      box-shadow: var(--tg-shadow-sm);
    }
    .progress-card {
      background: var(--tg-card);
      border-radius: var(--tg-radius-lg);
      padding: var(--tg-spacing-2xl);
      box-shadow: var(--tg-shadow-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .progress-ring-container {
      position: relative;
      width: 120px;
      height: 120px;
      margin-top: var(--tg-spacing-md);
    }
    .progress-ring-bg {
      fill: none;
      stroke: var(--tg-muted);
      stroke-width: 10;
    }
    .progress-ring-fg {
      fill: none;
      stroke: var(--tg-primary);
      stroke-width: 10;
      stroke-linecap: round;
      transform: rotate(-90deg);
      transform-origin: center;
      stroke-dasharray: 314;
      stroke-dashoffset: 125.6;
    }
    .progress-ring-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .medication-card {
      background: var(--tg-card);
      border-radius: var(--tg-radius-lg);
      padding: var(--tg-spacing-xl);
      box-shadow: var(--tg-shadow-sm);
      min-height: 64px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: var(--tg-radius-full);
      font-size: var(--tg-text-xs);
      font-weight: var(--tg-weight-medium);
      white-space: nowrap;
    }
    .status-taken {
      background: var(--state-success-light);
      color: var(--state-success);
    }
    .status-pending {
      background: var(--state-warning-light);
      color: var(--state-warning);
    }
    .status-skipped {
      background: var(--tg-muted);
      color: var(--tg-neutral-400);
    }
    .floating-btn {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 100%;
      min-height: 60px;
      background: var(--tg-primary);
      color: var(--tg-primary-foreground);
      border: none;
      font-size: var(--tg-text-lg);
      font-weight: var(--tg-weight-bold);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      z-index: 40;
      padding-bottom: env(safe-area-inset-bottom, 0);
      font-family: var(--tg-font-sans);
    }
    .floating-btn:active {
      background: #0D6560;
    }
    .page-content {
      padding: 0 var(--tg-spacing-lg) 80px var(--tg-spacing-lg);
      display: flex;
      flex-direction: column;
      gap: var(--tg-spacing-md);
    }
    @media (min-width: 768px) {
      .page-content {
        margin-left: 72px;
        max-width: 648px;
        margin-right: auto;
        padding-left: 32px;
        padding-right: 32px;
        padding-bottom: 32px;
      }
      .top-nav {
        margin-left: 72px;
        max-width: 648px;
      }
      .status-bar-spacer {
        display: none;
      }
      .floating-btn {
        position: relative;
        left: auto;
        transform: none;
        bottom: auto;
        max-width: 648px;
        margin: 0 auto;
        margin-left: 72px;
        border-radius: var(--tg-radius-md);
        padding: 16px;
      }
    }
  </style>
</body>
</html>
