    <style id="theme-vars">
/* TremorGuard Brand Design System
   Healthcare-grade accessible design for Parkinson's patients
   Prefix: tg */

:root {
  /* ---- Primary Palette ---- */
  --tg-primary: #0F766E;
  --tg-primary-foreground: #FFFFFF;
  --tg-primary-light: #14B8A6;

  /* ---- Semantic State Colors ---- */
  --state-success: #059669;
  --state-success-foreground: #FFFFFF;
  --state-success-light: #ECFDF5;
  --state-warning: #D97706;
  --state-warning-foreground: #FFFFFF;
  --state-warning-light: #FFFBEB;
  --state-error: #DC2626;
  --state-error-foreground: #FFFFFF;
  --state-error-light: #FEF2F2;
  --state-info: #0891B2;
  --state-info-foreground: #FFFFFF;
  --state-info-light: #ECFEFF;

  /* ---- Neutral Scale ---- */
  --tg-neutral-50: #F8F9FB;
  --tg-neutral-100: #F1F3F5;
  --tg-neutral-200: #E5E7EB;
  --tg-neutral-300: #D1D5DB;
  --tg-neutral-400: #9CA3AF;
  --tg-neutral-500: #6B7280;
  --tg-neutral-600: #4B5563;
  --tg-neutral-700: #374151;
  --tg-neutral-800: #1F2937;
  --tg-neutral-900: #1A1D23;

  /* ---- Surface / Card Colors ---- */
  --tg-background: #F8F9FB;
  --tg-foreground: #1A1D23;
  --tg-card: #FFFFFF;
  --tg-card-foreground: #1A1D23;
  --tg-muted: #F1F3F5;
  --tg-muted-foreground: #6B7280;
  --tg-popover: #FFFFFF;
  --tg-popover-foreground: #1A1D23;
  --tg-border: #E5E7EB;
  --tg-input: #E5E7EB;
  --tg-ring: #0F766E;

  /* ---- Radius Scale ---- */
  --tg-radius-sm: 6px;
  --tg-radius-md: 12px;
  --tg-radius-lg: 16px;
  --tg-radius-full: 9999px;

  /* ---- Typography ---- */
  --tg-font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --tg-text-sm: 14px;
  --tg-text-base: 16px;
  --tg-text-lg: 18px;
  --tg-text-xl: 20px;
  --tg-text-2xl: 24px;
  --tg-weight-regular: 400;
  --tg-weight-medium: 500;
  --tg-weight-bold: 700;

  /* ---- Shadows ---- */
  --tg-shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --tg-shadow-md: 0 2px 8px rgba(0,0,0,0.05);
  --tg-shadow-floating: 0 8px 24px rgba(0,0,0,0.08);
}
    </style>

    <style type="text/tailwindcss">

    <style>
    body {
      background: var(--tg-background);
      min-height: 100vh;
      max-width: 100%;
      margin: 0;
      font-family: var(--tg-font-sans);
      color: var(--tg-foreground);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ---- Left Sidebar ---- */
    .desktop-sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 240px;
      background: var(--tg-card);
      border-right: 1px solid var(--tg-border);
      display: flex;
      flex-direction: column;
      z-index: 100;
      padding: 0;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 28px 24px 32px 24px;
      border-bottom: 1px solid var(--tg-border);
    }

    .sidebar-logo-text {
      font-size: var(--tg-text-lg);
      font-weight: var(--tg-weight-bold);
      color: var(--tg-primary);
      letter-spacing: -0.01em;
    }

    .sidebar-nav {
      flex: 1;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sidebar-nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: var(--tg-radius-md);
      font-size: var(--tg-text-base);
      font-weight: var(--tg-weight-medium);
      color: var(--tg-neutral-500);
      text-decoration: none;
      cursor: pointer;
      min-height: 44px;
      transition: background 0.15s, color 0.15s;
    }

    .sidebar-nav-item:hover {
      background: var(--tg-muted);
      color: var(--tg-neutral-700);
    }

    .sidebar-nav-item.active {
      background: #F0FDFA;
      color: var(--tg-primary);
    }

    .sidebar-nav-item svg {
      flex-shrink: 0;
    }

    /* ---- Sidebar User ---- */
    .sidebar-user {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 20px 24px;
      border-top: 1px solid var(--tg-border);
    }

    .sidebar-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--tg-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--tg-primary-foreground);
      font-size: var(--tg-text-xl);
      font-weight: var(--tg-weight-bold);
      flex-shrink: 0;
    }

    .sidebar-user-info {
      min-width: 0;
    }

    .sidebar-user-name {
      font-size: var(--tg-text-base);
      font-weight: var(--tg-weight-bold);
      color: var(--tg-foreground);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-user-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      font-size: var(--tg-text-sm);
      color: var(--state-success);
      font-weight: var(--tg-weight-medium);
    }

    .green-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--state-success);
      flex-shrink: 0;
    }

    /* ---- Main Content ---- */
    .desktop-main {
      margin-left: 240px;
      padding: 32px;
    }

    /* ---- Profile Header Card ---- */
    .profile-header-card {
      display: flex;
      align-items: center;
      gap: 20px;
      background: var(--tg-card);
      border-radius: var(--tg-radius-lg);
      padding: 32px;
      box-shadow: var(--tg-shadow-sm);
      border: 1px solid var(--tg-border);
      margin-bottom: 24px;
    }

    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--tg-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--tg-primary-foreground);
      font-size: var(--tg-text-2xl);
      font-weight: var(--tg-weight-bold);
      flex-shrink: 0;
    }

    .profile-info {
      min-width: 0;
    }

    .profile-name {
      font-size: var(--tg-text-2xl);
      font-weight: var(--tg-weight-bold);
      color: var(--tg-foreground);
      line-height: 1.3;
    }

    .connection-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }

    .connection-badge span:not(.green-dot) {
      font-size: var(--tg-text-sm);
      color: var(--state-success);
      font-weight: var(--tg-weight-medium);
    }

    /* ---- Function Card ---- */
    .function-card {
      background: var(--tg-card);
      border-radius: var(--tg-radius-lg);
      box-shadow: var(--tg-shadow-sm);
      overflow: hidden;
      border: 1px solid var(--tg-border);
    }

    .function-item {
      display: flex;
      align-items: center;
      padding: 0 28px;
      min-height: 64px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .function-item:hover {
      background: var(--tg-muted);
    }

    .function-item + .function-item {
      border-top: 1px solid var(--tg-border);
    }

    .function-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--tg-radius-md);
      background: var(--tg-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 20px;
      flex-shrink: 0;
    }

    .function-label {
      flex: 1;
      font-size: var(--tg-text-base);
      font-weight: var(--tg-weight-medium);
      color: var(--tg-foreground);
    }

    .chevron {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    /* ---- Version ---- */
    .version-text {
      text-align: center;
      font-size: var(--tg-text-sm);
      color: var(--tg-neutral-400);
      padding: 24px 0 0 0;
    }
    </style>
</body>
</html>
