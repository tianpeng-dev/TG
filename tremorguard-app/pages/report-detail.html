    <style id="theme-vars">
/* TremorGuard Brand Design System
   Healthcare-grade accessible design for Parkinson's patients
   Prefix: tg */

:root {
  /* ---- Primary Palette ---- */
  --tg-primary: #0F766E;
  --tg-primary-foreground: #FFFFFF;
  --tg-primary-light: #14B8A6;

  /* ---- Semantic State Colors ---- */
  --state-success: #059669;
  --state-success-foreground: #FFFFFF;
  --state-success-light: #ECFDF5;
  --state-warning: #D97706;
  --state-warning-foreground: #FFFFFF;
  --state-warning-light: #FFFBEB;
  --state-error: #DC2626;
  --state-error-foreground: #FFFFFF;
  --state-error-light: #FEF2F2;
  --state-info: #0891B2;
  --state-info-foreground: #FFFFFF;
  --state-info-light: #ECFEFF;

  /* ---- Neutral Scale ---- */
  --tg-neutral-50: #F8F9FB;
  --tg-neutral-100: #F1F3F5;
  --tg-neutral-200: #E5E7EB;
  --tg-neutral-300: #D1D5DB;
  --tg-neutral-400: #9CA3AF;
  --tg-neutral-500: #6B7280;
  --tg-neutral-600: #4B5563;
  --tg-neutral-700: #374151;
  --tg-neutral-800: #1F2937;
  --tg-neutral-900: #1A1D23;

  /* ---- Surface / Card Colors ---- */
  --tg-background: #F8F9FB;
  --tg-foreground: #1A1D23;
  --tg-card: #FFFFFF;
  --tg-card-foreground: #1A1D23;
  --tg-muted: #F1F3F5;
  --tg-muted-foreground: #6B7280;
  --tg-popover: #FFFFFF;
  --tg-popover-foreground: #1A1D23;
  --tg-border: #E5E7EB;
  --tg-input: #E5E7EB;
  --tg-ring: #0F766E;

  /* ---- Message Bubble Colors ---- */
  --tg-msg-system: #F0FDFA;
  --tg-msg-user: #ECFEFF;
  --tg-msg-alert: #FFFBEB;
  --tg-msg-confirmed: #ECFDF5;

  /* ---- Radius Scale ---- */
  --tg-radius-sm: 6px;
  --tg-radius-md: 12px;
  --tg-radius-lg: 16px;
  --tg-radius-full: 9999px;

  /* ---- Spacing ---- */
  --tg-spacing-xs: 4px;
  --tg-spacing-sm: 8px;
  --tg-spacing-md: 12px;
  --tg-spacing-lg: 16px;
  --tg-spacing-xl: 20px;
  --tg-spacing-2xl: 24px;

  /* ---- Typography ---- */
  --tg-font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --tg-font-mono: 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace;

  --tg-text-xs: 14px;
  --tg-text-sm: 16px;
  --tg-text-base: 18px;
  --tg-text-lg: 20px;
  --tg-text-xl: 24px;
  --tg-text-2xl: 28px;
  --tg-text-3xl: 32px;

  --tg-leading-tight: 1.3;
  --tg-leading-normal: 1.5;
  --tg-leading-relaxed: 1.7;

  --tg-weight-regular: 400;
  --tg-weight-medium: 500;
  --tg-weight-semibold: 600;
  --tg-weight-bold: 700;

  /* ---- Shadows (static: alpha <= 0.05; floating layers may exceed) ---- */
  --tg-shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --tg-shadow-md: 0 2px 8px rgba(0,0,0,0.05);
  --tg-shadow-floating: 0 8px 24px rgba(0,0,0,0.08);
  --tg-shadow-overlay: 0 16px 48px rgba(0,0,0,0.12);

  /* ---- Semantic Aliases for apply-html-head-contract ---- */
  --tg-background: #F8F9FB;
  --tg-foreground: #1A1D23;
  --tg-card: #FFFFFF;
  --tg-card-foreground: #1A1D23;
  --tg-popover: #FFFFFF;
  --tg-popover-foreground: #1A1D23;
  --tg-primary: #0F766E;
  --tg-primary-foreground: #FFFFFF;
  --tg-muted: #F1F3F5;
  --tg-muted-foreground: #6B7280;
  --tg-border: #E5E7EB;
  --tg-input: #E5E7EB;
  --tg-ring: #0F766E;
  --tg-radius-sm: 6px;
  --tg-radius-md: 12px;
  --tg-radius-lg: 16px;
  --tg-radius-full: 9999px;
}

/* ---- Typography Scale ---- */
.tg-text-xs { font-size: var(--tg-text-xs); line-height: var(--tg-leading-normal); font-weight: var(--tg-weight-regular); }
.tg-text-sm { font-size: var(--tg-text-sm); line-height: var(--tg-leading-normal); font-weight: var(--tg-weight-regular); }
.tg-text-base { font-size: var(--tg-text-base); line-height: var(--tg-leading-normal); font-weight: var(--tg-weight-regular); }
.tg-text-lg { font-size: var(--tg-text-lg); line-height: var(--tg-leading-tight); font-weight: var(--tg-weight-bold); }
.tg-text-xl { font-size: var(--tg-text-xl); line-height: var(--tg-leading-tight); font-weight: var(--tg-weight-bold); }

.tg-font-medium { font-weight: var(--tg-weight-medium); }
.tg-font-semibold { font-weight: var(--tg-weight-semibold); }
.tg-font-bold { font-weight: var(--tg-weight-bold); }

    <style>
    /* ===== Critical Layout CSS (static, non-Tailwind) ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }

    body {
      background-color: var(--tg-background);
      color: var(--tg-foreground);
      font-family: var(--tg-font-sans);
      min-height: 100vh;
      max-width: 100%;
      margin: 0;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Status bar spacer */
    .status-bar-spacer {
      height: 44px;
      width: 100%;
      background-color: var(--tg-background);
      flex-shrink: 0;
    }

    /* Top navigation */
    .top-nav {
      height: 56px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      background-color: var(--tg-background);
      position: relative;
    }

    .top-nav__back {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      min-width: 48px;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      border-radius: var(--tg-radius-md);
    }

    .top-nav__back:active {
      background-color: var(--tg-muted);
    }

    .top-nav__title {
      font-size: var(--tg-text-lg);
      font-weight: var(--tg-weight-bold);
      color: var(--tg-foreground);
      letter-spacing: 0.01em;
    }

    /* Report card */
    .report-card {
      background-color: var(--tg-card);
      border-radius: var(--tg-radius-lg);
      margin: 0 16px;
      padding: 24px 20px;
      box-shadow: var(--tg-shadow-sm);
    }

    /* Conclusion */
    .report-conclusion {
      text-align: center;
      font-size: var(--tg-text-lg);
      font-weight: var(--tg-weight-bold);
      color: var(--tg-primary);
      line-height: var(--tg-leading-relaxed);
      padding-bottom: 24px;
    }

    /* Metrics row */
    .metrics-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0;
      border-top: 1px solid var(--tg-border);
      border-bottom: 1px solid var(--tg-border);
    }

    .metric-block {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4px 0;
    }

    .metric-divider {
      width: 1px;
      height: 48px;
      background-color: var(--tg-neutral-200);
      flex-shrink: 0;
    }

    .metric-value {
      font-size: var(--tg-text-2xl);
      font-weight: var(--tg-weight-bold);
      line-height: var(--tg-leading-tight);
      color: var(--tg-primary);
    }

    .metric-value--success {
      color: var(--state-success);
    }

    .metric-label {
      font-size: var(--tg-text-xs);
      font-weight: var(--tg-weight-regular);
      color: var(--tg-muted-foreground);
      line-height: var(--tg-leading-normal);
      margin-top: 4px;
    }

    /* Chart section */
    .chart-section {
      padding: 20px 0 0;
      border-bottom: 1px solid var(--tg-border);
    }

    .chart-title {
      font-size: var(--tg-text-sm);
      font-weight: var(--tg-weight-medium);
      color: var(--tg-foreground);
      margin-bottom: 12px;
    }

    .chart-container {
      width: 100%;
      height: 160px;
      position: relative;
      background-color: var(--tg-card);
    }

    .chart-svg {
      width: 100%;
      height: 100%;
    }

    /* Medication adherence */
    .medication-section {
      padding: 20px 0;
      border-bottom: 1px solid var(--tg-border);
    }

    .medication-title {
      font-size: var(--tg-text-base);
      font-weight: var(--tg-weight-medium);
      color: var(--tg-foreground);
      margin-bottom: 16px;
    }

    .dose-dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .dose-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dose-dot--taken {
      background-color: var(--state-success);
    }

    .dose-dot--late {
      background-color: var(--state-warning);
    }

    .dose-dot--missed {
      background-color: var(--tg-neutral-300);
    }

    .dose-dot-label {
      width: 100%;
      text-align: center;
      font-size: var(--tg-text-sm);
      font-weight: var(--tg-weight-medium);
      color: var(--tg-primary);
    }

    /* Buttons */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 60px;
      padding: 0 20px;
      border-radius: var(--tg-radius-md);
      font-size: var(--tg-text-lg);
      font-weight: var(--tg-weight-bold);
      cursor: pointer;
      border: 2px solid transparent;
      text-decoration: none;
      line-height: 1;
      -webkit-user-select: none;
      user-select: none;
