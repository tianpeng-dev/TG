<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TremorGuard - 首页</title>
    <style id="theme-vars">
/* TremorGuard Brand Design System
   Healthcare-grade accessible design for Parkinson's patients
   Prefix: tg */

:root {
  /* ---- Primary Palette ---- */
  --tg-primary: #0F766E;
  --tg-primary-foreground: #FFFFFF;
  --tg-primary-light: #14B8A6;

  /* ---- Semantic State Colors ---- */
  --state-success: #059669;
  --state-success-foreground: #FFFFFF;
  --state-success-light: #ECFDF5;
  --state-warning: #D97706;
  --state-warning-foreground: #FFFFFF;
  --state-warning-light: #FFFBEB;
  --state-error: #DC2626;
  --state-error-foreground: #FFFFFF;
  --state-error-light: #FEF2F2;
  --state-info: #0891B2;
  --state-info-foreground: #FFFFFF;
  --state-info-light: #ECFEFF;

  /* ---- Neutral Scale ---- */
  --tg-neutral-50: #F8F9FB;
  --tg-neutral-100: #F1F3F5;
  --tg-neutral-200: #E5E7EB;
  --tg-neutral-300: #D1D5DB;
  --tg-neutral-400: #9CA3AF;
  --tg-neutral-500: #6B7280;
  --tg-neutral-600: #4B5563;
  --tg-neutral-700: #374151;
  --tg-neutral-800: #1F2937;
  --tg-neutral-900: #1A1D23;

  /* ---- Surface / Card Colors ---- */
  --tg-background: #F8F9FB;
  --tg-foreground: #1A1D23;
  --tg-card: #FFFFFF;
  --tg-card-foreground: #1A1D23;
  --tg-muted: #F1F3F5;
  --tg-muted-foreground: #6B7280;
  --tg-popover: #FFFFFF;
  --tg-popover-foreground: #1A1D23;
  --tg-border: #E5E7EB;
  --tg-input: #E5E7EB;
  --tg-ring: #0F766E;

  /* ---- Message Bubble Colors ---- */
  --tg-msg-system: #F0FDFA;
  --tg-msg-user: #ECFEFF;
  --tg-msg-alert: #FFFBEB;
  --tg-msg-confirmed: #ECFDF5;

  /* ---- Radius Scale ---- */
  --tg-radius-sm: 6px;
  --tg-radius-md: 12px;
  --tg-radius-lg: 16px;
  --tg-radius-full: 9999px;

  /* ---- Spacing ---- */
  --tg-spacing-xs: 4px;
  --tg-spacing-sm: 8px;
  --tg-spacing-md: 12px;
  --tg-spacing-lg: 16px;
  --tg-spacing-xl: 20px;
  --tg-spacing-2xl: 24px;

  /* ---- Typography ---- */
  --tg-font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --tg-font-mono: 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace;

  --tg-text-xs: 14px;
  --tg-text-sm: 16px;
  --tg-text-base: 18px;
  --tg-text-lg: 20px;
  --tg-text-xl: 24px;
  --tg-text-2xl: 28px;
  --tg-text-3xl: 32px;

  --tg-leading-tight: 1.3;
  --tg-leading-normal: 1.5;
  --tg-leading-relaxed: 1.7;

  --tg-weight-regular: 400;
  --tg-weight-medium: 500;
  --tg-weight-semibold: 600;
  --tg-weight-bold: 700;

  /* ---- Shadows (static: alpha <= 0.05; floating layers may exceed) ---- */
  --tg-shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --tg-shadow-md: 0 2px 8px rgba(0,0,0,0.05);
  --tg-shadow-floating: 0 8px 24px rgba(0,0,0,0.08);
  --tg-shadow-overlay: 0 16px 48px rgba(0,0,0,0.12);

  /* ---- Semantic Aliases for apply-html-head-contract ---- */
  --tg-background: #F8F9FB;
  --tg-foreground: #1A1D23;
  --tg-card: #FFFFFF;
  --tg-card-foreground: #1A1D23;
  --tg-popover: #FFFFFF;
  --tg-popover-foreground: #1A1D23;
  --tg-primary: #0F766E;
  --tg-primary-foreground: #FFFFFF;
  --tg-muted: #F1F3F5;
  --tg-muted-foreground: #6B7280;
  --tg-border: #E5E7EB;
  --tg-input: #E5E7EB;
  --tg-ring: #0F766E;
  --tg-radius-sm: 6px;
  --tg-radius-md: 12px;
  --tg-radius-lg: 16px;
  --tg-radius-full: 9999px;
}

/* ---- Typography Scale ---- */
.tg-text-xs { font-size: var(--tg-text-xs); line-height: var(--tg-leading-normal); font-weight: var(--tg-weight-regular); }
.tg-text-sm { font-size: var(--tg-text-sm); line-height: var(--tg-leading-normal); font-weight: var(--tg-weight-regular); }
.tg-text-base { font-size: var(--tg-text-base); line-height: var(--tg-leading-normal); font-weight: var(--tg-weight-regular); }
.tg-text-lg { font-size: var(--tg-text-lg); line-height: var(--tg-leading-tight); font-weight: var(--tg-weight-bold); }
.tg-text-xl { font-size: var(--tg-text-xl); line-height: var(--tg-leading-tight); font-weight: var(--tg-weight-bold); }

.tg-font-medium { font-weight: var(--tg-weight-medium); }
.tg-font-semibold { font-weight: var(--tg-weight-semibold); }
.tg-font-bold { font-weight: var(--tg-weight-bold); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--tg-background);
    --color-foreground: var(--tg-foreground);
    --color-card: var(--tg-card);
    --color-card-foreground: var(--tg-card-foreground);
    --color-popover: var(--tg-popover);
    --color-popover-foreground: var(--tg-popover-foreground);
    --color-primary: var(--tg-primary);
    --color-primary-foreground: var(--tg-primary-foreground);
    --color-muted: var(--tg-muted);
    --color-muted-foreground: var(--tg-muted-foreground);
    --color-border: var(--tg-border);
    --color-input: var(--tg-input);
    --color-ring: var(--tg-ring);
    --radius-sm: var(--tg-radius-sm);
    --radius-md: var(--tg-radius-md);
    --radius-lg: var(--tg-radius-lg);
  }
  @layer base {
    body { background: var(--tg-background); color: var(--tg-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--tg-background); }
      .text-background { color: var(--tg-background); }
      .border-background { border-color: var(--tg-background); }
      .ring-background { --tw-ring-color: var(--tg-background); }
      .bg-foreground { background-color: var(--tg-foreground); }
      .text-foreground { color: var(--tg-foreground); }
      .border-foreground { border-color: var(--tg-foreground); }
      .ring-foreground { --tw-ring-color: var(--tg-foreground); }
      .bg-card { background-color: var(--tg-card); }
      .text-card { color: var(--tg-card); }
      .border-card { border-color: var(--tg-card); }
      .ring-card { --tw-ring-color: var(--tg-card); }
      .bg-card-foreground { background-color: var(--tg-card-foreground); }
      .text-card-foreground { color: var(--tg-card-foreground); }
      .border-card-foreground { border-color: var(--tg-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--tg-card-foreground); }
      .bg-popover { background-color: var(--tg-popover); }
      .text-popover { color: var(--tg-popover); }
      .border-popover { border-color: var(--tg-popover); }
      .ring-popover { --tw-ring-color: var(--tg-popover); }
      .bg-popover-foreground { background-color: var(--tg-popover-foreground); }
      .text-popover-foreground { color: var(--tg-popover-foreground); }
      .border-popover-foreground { border-color: var(--tg-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--tg-popover-foreground); }
      .bg-primary { background-color: var(--tg-primary); }
      .text-primary { color: var(--tg-primary); }
      .border-primary { border-color: var(--tg-primary); }
      .ring-primary { --tw-ring-color: var(--tg-primary); }
      .bg-primary-foreground { background-color: var(--tg-primary-foreground); }
      .text-primary-foreground { color: var(--tg-primary-foreground); }
      .border-primary-foreground { border-color: var(--tg-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--tg-primary-foreground); }
      .bg-muted { background-color: var(--tg-muted); }
      .text-muted { color: var(--tg-muted); }
      .border-muted { border-color: var(--tg-muted); }
      .ring-muted { --tw-ring-color: var(--tg-muted); }
      .bg-muted-foreground { background-color: var(--tg-muted-foreground); }
      .text-muted-foreground { color: var(--tg-muted-foreground); }
      .border-muted-foreground { border-color: var(--tg-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--tg-muted-foreground); }
      .bg-border { background-color: var(--tg-border); }
      .text-border { color: var(--tg-border); }
      .border-border { border-color: var(--tg-border); }
      .ring-border { --tw-ring-color: var(--tg-border); }
      .bg-input { background-color: var(--tg-input); }
      .text-input { color: var(--tg-input); }
      .border-input { border-color: var(--tg-input); }
      .ring-input { --tw-ring-color: var(--tg-input); }
      .bg-ring { background-color: var(--tg-ring); }
      .text-ring { color: var(--tg-ring); }
      .border-ring { border-color: var(--tg-ring); }
      .ring-ring { --tw-ring-color: var(--tg-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body>

  <!-- 1. Status bar spacer -->
  <div class="status-bar-spacer" aria-hidden="true"></div>

  <!-- 2. Top navigation bar -->
  <nav class="top-nav" role="navigation" aria-label="顶部导航">
    <div class="top-nav__left">
      <span class="connection-dot" aria-label="设备已连接"></span>
      <!-- Device icon (watch) -->
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="6" y="6" width="12" height="12" rx="3" stroke="#0F766E" stroke-width="2" fill="none"/>
        <path d="M10 6V4a2 2 0 0 1 2-2h0a2 2 0 0 1 2 2v2" stroke="#0F766E" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M10 18v2a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2v-2" stroke="#0F766E" stroke-width="2" stroke-linecap="round" fill="none"/>
        <circle cx="12" cy="12" r="2" fill="#0F766E"/>
      </svg>
    </div>
    <span class="top-nav__center">TremorGuard</span>
    <div class="top-nav__right">
      <button class="top-nav__right-button" aria-label="设置">
        <!-- Gear icon -->
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="3" stroke="#1A1D23" stroke-width="2" fill="none"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke="#1A1D23" stroke-width="1.5" fill="none"/>
        </svg>
      </button>
    </div>
  </nav>

  <!-- 3. Chat message area (scrollable, flex-grow) -->
  <div class="chat-wrapper">
    <div class="chat-container">
      <main class="chat-area no-scrollbar" role="main" aria-label="对话消息">

        <!-- MESSAGE 1: AI morning summary -->
        <div class="chat-msg chat-msg--ai">
          <div class="chat-msg__avatar" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <rect x="5" y="8" width="14" height="12" rx="3" stroke="#FFFFFF" stroke-width="2" fill="none"/>
              <circle cx="9.5" cy="13" r="1.5" fill="#FFFFFF"/>
              <circle cx="14.5" cy="13" r="1.5" fill="#FFFFFF"/>
              <path d="M12 4v4M9 2l3 2 3-2" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              <path d="M9 17h6" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="chat-msg__content">
            <div class="chat-bubble chat-bubble--ai">
              <p>早安，张阿姨！昨晚睡眠期间震颤 2 次，每次约 15 分钟。晨起服药后 30 分钟已起效。</p>
            </div>
            <span class="chat-msg__time">08:00</span>
          </div>
        </div>

        <!-- MESSAGE 2: User message -->
        <div class="chat-msg chat-msg--user">
          <div class="chat-msg__content">
            <div class="chat-bubble chat-bubble--user">
              <p>今天感觉怎么样？</p>
            </div>
            <span class="chat-msg__time chat-msg__time--right">08:05</span>
          </div>
        </div>

        <!-- MESSAGE 3: AI medication reminder with rich card -->
        <div class="chat-msg chat-msg--ai">
          <div class="chat-msg__avatar" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <rect x="5" y="8" width="14" height="12" rx="3" stroke="#FFFFFF" stroke-width="2" fill="none"/>
              <circle cx="9.5" cy="13" r="1.5" fill="#FFFFFF"/>
              <circle cx="14.5" cy="13" r="1.5" fill="#FFFFFF"/>
              <path d="M12 4v4M9 2l3 2 3-2" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              <path d="M9 17h6" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="chat-msg__content">
            <div class="chat-bubble chat-bubble--ai">
              <div class="rich-card rich-card--medication">
                <div class="rich-card__header">
                  <!-- Pill icon -->
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <rect x="3" y="11" width="4" height="8" rx="2" fill="#D97706"/>
                    <rect x="17" y="11" width="4" height="8" rx="2" fill="#D97706"/>
                    <rect x="7" y="7" width="10" height="16" rx="5" stroke="#D97706" stroke-width="2" fill="none"/>
                    <path d="M7 14h10" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
                  </svg>
                  <span class="rich-card__title">12:00 用药提醒</span>
                </div>
                <p class="rich-card__body">该服用左旋多巴 250mg 了</p>
                <div class="rich-card__actions">
                  <button class="rich-card__btn rich-card__btn--success" type="button">已服药</button>
                  <button class="rich-card__btn rich-card__btn--ghost" type="button">稍后提醒</button>
                </div>
              </div>
            </div>
            <span class="chat-msg__time">12:00</span>
          </div>
        </div>

        <!-- MESSAGE 4: AI alert message (critical) -->
        <div class="chat-msg chat-msg--ai">
          <div class="chat-msg__avatar" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <rect x="5" y="8" width="14" height="12" rx="3" stroke="#FFFFFF" stroke-width="2" fill="none"/>
              <circle cx="9.5" cy="13" r="1.5" fill="#FFFFFF"/>
              <circle cx="14.5" cy="13" r="1.5" fill="#FFFFFF"/>
              <path d="M12 4v4M9 2l3 2 3-2" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              <path d="M9 17h6" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="chat-msg__content">
            <div class="chat-bubble chat-bubble--alert">
              <div class="alert-header">
                <span class="alert-header__title">异常警报</span>
                <div class="pulse-indicator" aria-label="紧急">
                  <div class="pulse-indicator__dot"></div>
                </div>
              </div>
              <p class="alert-body">震颤水平升高（振幅 3.5cm），检测到剂末现象</p>
              <div class="rich-card__actions rich-card__actions--triple">
                <button class="rich-card__btn rich-card__btn--success" type="button">已服药</button>
                <button class="rich-card__btn rich-card__btn--warning" type="button">通知照护者</button>
                <button class="rich-card__btn rich-card__btn--outline" type="button">查看数据</button>
              </div>
            </div>
            <span class="chat-msg__time">14:32</span>
          </div>
        </div>

        <!-- MESSAGE 5: AI daily report -->
        <div class="chat-msg chat-msg--ai">
          <div class="chat-msg__avatar" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <rect x="5" y="8" width="14" height="12" rx="3" stroke="#FFFFFF" stroke-width="2" fill="none"/>
              <circle cx="9.5" cy="13" r="1.5" fill="#FFFFFF"/>
              <circle cx="14.5" cy="13" r="1.5" fill="#FFFFFF"/>
              <path d="M12 4v4M9 2l3 2 3-2" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              <path d="M9 17h6" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="chat-msg__content">
            <div class="chat-bubble chat-bubble--ai">
              <p>今日报告已生成。本周震颤强度下降 18%，日均发作次数从 3.2 次降到 2.1 次。</p>
              <div class="rich-card__actions" style="margin-top: 12px;">
                <button class="rich-card__btn rich-card__btn--primary" type="button">查看完整报告</button>
                <button class="rich-card__btn rich-card__btn--outline" type="button">分享给医生</button>
              </div>
            </div>
            <span class="chat-msg__time">20:00</span>
          </div>
        </div>

      </main>

      <!-- 4. Quick action suggestions bar -->
      <div class="quick-actions no-scrollbar" role="toolbar" aria-label="快捷操作">
        <button class="quick-action-chip" type="button">查看今日报告</button>
        <button class="quick-action-chip" type="button">用药记录</button>
        <button class="quick-action-chip" type="button">最近一周趋势</button>
        <button class="quick-action-chip" type="button">联系医生</button>
      </div>

      <!-- 5. Bottom input bar -->
      <div class="input-bar">
        <button class="input-bar__voice-btn" type="button" aria-label="语音输入">
          <!-- Microphone icon -->
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="9" y="2" width="6" height="11" rx="3" stroke="#6B7280" stroke-width="2" fill="none"/>
            <path d="M5 10a7 7 0 0 0 14 0" stroke="#6B7280" stroke-width="2" stroke-linecap="round" fill="none"/>
            <line x1="12" y1="17" x2="12" y2="22" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
            <line x1="8" y1="22" x2="16" y2="22" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <input class="input-bar__field" type="text" placeholder="输入消息..." aria-label="消息输入框" />
        <button class="input-bar__send-btn" type="button" aria-label="发送">
          <!-- Send icon -->
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M22 2L11 13" stroke="#0F766E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="#0F766E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="#0F766E" fill-opacity="0.15"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- 6. Bottom tab navigation -->
  <nav class="bottom-nav" data-mobile-nav="global" role="navigation" aria-label="底部导航">
    <button class="bottom-nav__tab bottom-nav__tab--active" data-nav-key="home" aria-label="首页" aria-current="page">
      <!-- Home icon (active) -->
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 0 0 1 1h3m10-11l2 2m-2-2v10a1 1 0 0 1-1 1h-3m-4 0a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1" stroke="#0F766E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="#0F766E" fill-opacity="0.15"/>
      </svg>
      <span class="bottom-nav__label whitespace-nowrap">首页</span>
    </button>
    <button class="bottom-nav__tab bottom-nav__tab--inactive" data-dom-id="tab-reports" data-nav-key="reports" aria-label="报告">
      <!-- Reports icon -->

    /* ===== Critical Layout CSS (static, non-Tailwind) ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
      height: 100%;
    }

    body {
      background-color: var(--tg-background);
      color: var(--tg-foreground);

    }

      background-color: var(--tg-background);

      top: 0;
      z-index: 100;
      max-width: 720px;
      margin: 0 auto;
    }

    .top-nav__left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      min-width: 48px;
    }

    .top-nav__center {
      font-size: var(--tg-text-base);
      font-weight: var(--tg-weight-medium);
      color: var(--tg-foreground);
      letter-spacing: 0.01em;
    }

    .top-nav__right {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 48px;
      min-height: 48px;
    }

    .top-nav__right-button {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      min-width: 48px;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--tg-radius-md);
      transition: background-color 0.15s ease;
    }

    .top-nav__right-button:active {
      background-color: var(--tg-muted);
    }

    /* Connection dot */
    .connection-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--state-success);
      display: inline-block;
      flex-shrink: 0;
    }

    /* Chat wrapper - fills viewport between top nav and bottom nav */
    .chat-wrapper {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 44px - 56px - 64px);
      overflow: hidden;
    }

    .chat-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }

    /* Chat message area - scrollable */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Chat message rows */
    .chat-msg {
      display: flex;
      gap: 10px;
      max-width: 85%;
    }

    .chat-msg--ai {
      align-self: flex-start;
    }

    .chat-msg--user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    /* AI avatar circle */
    .chat-msg__avatar {
      width: 36px;
      height: 36px;
      min-width: 36px;
      border-radius: 50%;
      background-color: var(--tg-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      align-self: flex-start;
    }

    /* Message content wrapper */
    .chat-msg__content {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* Chat bubbles */
    .chat-bubble {
      padding: 14px 16px;
      border-radius: var(--tg-radius-lg);
      line-height: var(--tg-leading-relaxed);
      font-size: var(--tg-text-sm);
    }

    .chat-bubble--ai {
      background-color: var(--tg-msg-system);
      color: var(--tg-foreground);
      border-top-left-radius: 4px;
    }

    .chat-bubble--user {
      background-color: var(--tg-primary);
      color: var(--tg-primary-foreground);
      border-top-right-radius: 4px;
    }

    .chat-bubble--alert {
      background-color: var(--tg-msg-alert);
      color: var(--tg-foreground);
      border-top-left-radius: 4px;
      border-left: 4px solid var(--state-error);
      padding: 14px 16px;
      border-radius: 0 var(--tg-radius-lg) var(--tg-radius-lg) 0;
    }

    /* Timestamps */
    .chat-msg__time {
      font-size: 12px;
      color: var(--tg-neutral-400);
      margin-top: 6px;
      padding-left: 4px;
    }

    .chat-msg__time--right {
      text-align: right;
      padding-right: 4px;
      padding-left: 0;
    }

    /* ===== Alert header with pulse ===== */
    .alert-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .alert-header__title {
      font-size: var(--tg-text-base);
      font-weight: var(--tg-weight-bold);
      color: var(--state-error);
    }

    .pulse-indicator {
      width: 14px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .pulse-indicator__dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: var(--state-error);
      position: relative;
    }

    .pulse-indicator__dot::before {
      content: '';
      position: absolute;
      top: -4px;
      left: -4px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background-color: rgba(220, 38, 38, 0.3);
      animation: pulse-opacity 2s ease-in-out infinite;
    }

    @keyframes pulse-opacity {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(1.3); }
    }

    .alert-body {
      font-size: var(--tg-text-sm);
      color: var(--tg-foreground);
      line-height: var(--tg-leading-relaxed);
      margin-bottom: 4px;
    }

    /* ===== Rich card (medication reminder) ===== */
    .rich-card {
      display: flex;
      flex-direction: column;
    }

    .rich-card__header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .rich-card__title {
      font-size: var(--tg-text-sm);
      font-weight: var(--tg-weight-semibold);
      color: var(--state-warning);
    }

    .rich-card__body {
      font-size: var(--tg-text-sm);
      color: var(--tg-foreground);
      line-height: var(--tg-leading-relaxed);
      margin-bottom: 4px;
    }

    /* Rich card action buttons */
    .rich-card__actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .rich-card__btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      min-width: 48px;
      padding: 0 16px;
      border-radius: var(--tg-radius-md);
      font-size: 16px;
      font-weight: var(--tg-weight-medium);
      cursor: pointer;
      border: 2px solid transparent;
      line-height: 1.2;
      transition: opacity 0.15s ease;
      -webkit-user-select: none;
      user-select: none;
      flex: 1;
    }

    .rich-card__btn:active {
      opacity: 0.8;
    }

    .rich-card__btn--primary {
      background-color: var(--tg-primary);
      color: var(--tg-primary-foreground);
      border-color: var(--tg-primary);
    }

    .rich-card__btn--success {
      background-color: var(--state-success);
      color: var(--state-success-foreground);
      border-color: var(--state-success);
    }

    .rich-card__btn--warning {
      background-color: var(--state-warning);
      color: var(--state-warning-foreground);
      border-color: var(--state-warning);
    }

    .rich-card__btn--ghost {
      background-color: var(--tg-neutral-200);
      color: var(--tg-foreground);
      border-color: var(--tg-neutral-200);
    }

    .rich-card__btn--outline {
      background-color: var(--tg-card);
      color: var(--tg-primary);
      border-color: var(--tg-primary);
    }

    /* ===== Quick action suggestions bar ===== */
    .quick-actions {
      display: flex;
      gap: 10px;
      padding: 10px 16px;
      overflow-x: auto;
      overflow-y: hidden;
      flex-shrink: 0;
      background-color: var(--tg-background);
      border-top: 1px solid var(--tg-border);
    }

    .quick-action-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      border: 1.5px solid var(--tg-primary);
      background-color: var(--tg-card);
      color: var(--tg-primary);
      font-size: 14px;
      font-weight: var(--tg-weight-medium);
      white-space: nowrap;
      cursor: pointer;

      -webkit-user-select: none;

    }

    .input-bar {

    }

    .input-bar__send-btn {

      background: none;

      border-radius: 50%;

      -webkit-user-select: none;
      user-select: none;
    }

    .bottom-nav {

      font-weight: var(--tg-weight-medium);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;

    /* ===== Responsive: Desktop ===== */
    @media (min-width: 768px) {

        border-top: none;

      }
    }
