<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分享报告 - TremorGuard</title>
    <style id="theme-vars">
/* TremorGuard Brand Design System
   Healthcare-grade accessible design for Parkinson's patients
   Prefix: tg */

:root {
  /* ---- Primary Palette ---- */
  --tg-primary: #0F766E;
  --tg-primary-foreground: #FFFFFF;
  --tg-primary-light: #14B8A6;

  /* ---- Semantic State Colors ---- */
  --state-success: #059669;
  --state-success-foreground: #FFFFFF;
  --state-success-light: #ECFDF5;
  --state-warning: #D97706;
  --state-warning-foreground: #FFFFFF;
  --state-warning-light: #FFFBEB;
  --state-error: #DC2626;
  --state-error-foreground: #FFFFFF;
  --state-error-light: #FEF2F2;
  --state-info: #0891B2;
  --state-info-foreground: #FFFFFF;
  --state-info-light: #ECFEFF;

  /* ---- Neutral Scale ---- */
  --tg-neutral-50: #F8F9FB;
  --tg-neutral-100: #F1F3F5;
  --tg-neutral-200: #E5E7EB;
  --tg-neutral-300: #D1D5DB;
  --tg-neutral-400: #9CA3AF;
  --tg-neutral-500: #6B7280;
  --tg-neutral-600: #4B5563;
  --tg-neutral-700: #374151;
  --tg-neutral-800: #1F2937;
  --tg-neutral-900: #1A1D23;

  /* ---- Surface / Card Colors ---- */
  --tg-background: #F8F9FB;
  --tg-foreground: #1A1D23;
  --tg-card: #FFFFFF;
  --tg-card-foreground: #1A1D23;
  --tg-muted: #F1F3F5;
  --tg-muted-foreground: #6B7280;
  --tg-popover: #FFFFFF;
  --tg-popover-foreground: #1A1D23;
  --tg-border: #E5E7EB;
  --tg-input: #E5E7EB;
  --tg-ring: #0F766E;

  /* ---- Message Bubble Colors ---- */
  --tg-msg-system: #F0FDFA;
  --tg-msg-user: #ECFEFF;
  --tg-msg-alert: #FFFBEB;
  --tg-msg-confirmed: #ECFDF5;

  /* ---- Radius Scale ---- */
  --tg-radius-sm: 6px;
  --tg-radius-md: 12px;
  --tg-radius-lg: 16px;
  --tg-radius-full: 9999px;

  /* ---- Spacing ---- */
  --tg-spacing-xs: 4px;
  --tg-spacing-sm: 8px;
  --tg-spacing-md: 12px;
  --tg-spacing-lg: 16px;
  --tg-spacing-xl: 20px;
  --tg-spacing-2xl: 24px;

  /* ---- Typography ---- */
  --tg-font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --tg-font-mono: 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace;

  --tg-text-xs: 14px;
  --tg-text-sm: 16px;
  --tg-text-base: 18px;
  --tg-text-lg: 20px;
  --tg-text-xl: 24px;
  --tg-text-2xl: 28px;
  --tg-text-3xl: 32px;

  --tg-leading-tight: 1.3;
  --tg-leading-normal: 1.5;
  --tg-leading-relaxed: 1.7;

  --tg-weight-regular: 400;
  --tg-weight-medium: 500;
  --tg-weight-semibold: 600;
  --tg-weight-bold: 700;

  /* ---- Shadows (static: alpha <= 0.05; floating layers may exceed) ---- */
  --tg-shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --tg-shadow-md: 0 2px 8px rgba(0,0,0,0.05);
  --tg-shadow-floating: 0 8px 24px rgba(0,0,0,0.08);
  --tg-shadow-overlay: 0 16px 48px rgba(0,0,0,0.12);

  /* ---- Semantic Aliases for apply-html-head-contract ---- */
  --tg-background: #F8F9FB;
  --tg-foreground: #1A1D23;
  --tg-card: #FFFFFF;
  --tg-card-foreground: #1A1D23;
  --tg-popover: #FFFFFF;
  --tg-popover-foreground: #1A1D23;
  --tg-primary: #0F766E;
  --tg-primary-foreground: #FFFFFF;
  --tg-muted: #F1F3F5;
  --tg-muted-foreground: #6B7280;
  --tg-border: #E5E7EB;
  --tg-input: #E5E7EB;
  --tg-ring: #0F766E;
  --tg-radius-sm: 6px;
  --tg-radius-md: 12px;
  --tg-radius-lg: 16px;
  --tg-radius-full: 9999px;
}

/* ---- Typography Scale ---- */
.tg-text-xs { font-size: var(--tg-text-xs); line-height: var(--tg-leading-normal); font-weight: var(--tg-weight-regular); }
.tg-text-sm { font-size: var(--tg-text-sm); line-height: var(--tg-leading-normal); font-weight: var(--tg-weight-regular); }
.tg-text-base { font-size: var(--tg-text-base); line-height: var(--tg-leading-normal); font-weight: var(--tg-weight-regular); }
.tg-text-lg { font-size: var(--tg-text-lg); line-height: var(--tg-leading-tight); font-weight: var(--tg-weight-bold); }
.tg-text-xl { font-size: var(--tg-text-xl); line-height: var(--tg-leading-tight); font-weight: var(--tg-weight-bold); }

.tg-font-medium { font-weight: var(--tg-weight-medium); }
.tg-font-semibold { font-weight: var(--tg-weight-semibold); }
.tg-font-bold { font-weight: var(--tg-weight-bold); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>

    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--tg-background);
    --color-foreground: var(--tg-foreground);
    --color-card: var(--tg-card);
    --color-card-foreground: var(--tg-card-foreground);
    --color-popover: var(--tg-popover);
    --color-popover-foreground: var(--tg-popover-foreground);
    --color-primary: var(--tg-primary);
    --color-primary-foreground: var(--tg-primary-foreground);
    --color-muted: var(--tg-muted);
    --color-muted-foreground: var(--tg-muted-foreground);
    --color-border: var(--tg-border);
    --color-input: var(--tg-input);
    --color-ring: var(--tg-ring);
    --radius-sm: var(--tg-radius-sm);
    --radius-md: var(--tg-radius-md);
    --radius-lg: var(--tg-radius-lg);
  }
  @layer base {
    body { background: var(--tg-background); color: var(--tg-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }

</head>
<body>

  <!-- Scrim / Backdrop -->
  <div class="sheet-backdrop" data-dom-id="sheet-backdrop"></div>

  <!-- Bottom Sheet Panel -->
  <div class="bottom-sheet" role="dialog" aria-label="分享报告" aria-modal="true">

    <!-- Handle bar -->
    <div class="sheet-handle" aria-hidden="true">
      <div class="sheet-handle__bar"></div>
    </div>

    <!-- Title -->
    <h2 class="sheet-title">分享报告</h2>

    <!-- Body content -->
    <div class="sheet-body">

      <!-- Sharing options -->
      <div class="sheet-options">

        <!-- Option 1: SMS -->
        <div class="option-row" role="button" tabindex="0" aria-label="短信发送链接">
          <div class="option-icon">
            <!-- Message / SMS icon -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" stroke="#0F766E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
          </div>
          <span class="option-label">短信发送链接</span>
          <div class="option-chevron">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 18l6-6-6-6" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
          </div>
        </div>

        <!-- Option 2: Email -->
        <div class="option-row" role="button" tabindex="0" aria-label="邮件发送 PDF">
          <div class="option-icon">
            <!-- Mail / Email icon -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="2" y="4" width="20" height="16" rx="3" stroke="#0F766E" stroke-width="2" fill="none"/>
              <path d="M22 7l-10 7L2 7" stroke="#0F766E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
          </div>
          <span class="option-label">邮件发送 PDF</span>
          <div class="option-chevron">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 18l6-6-6-6" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
          </div>
        </div>

        <!-- Option 3: Print -->
        <div class="option-row" role="button" tabindex="0" aria-label="A4 打印">
          <div class="option-icon">
            <!-- Printer icon -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <polyline points="6 9 6 2 18 2 18 9" stroke="#0F766E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

              <rect x="6" y="14" width="12" height="8" rx="1" stroke="#0F766E" stroke-width="2" fill="none"/>
            </svg>
          </div>
          <span class="option-label">A4 打印</span>
          <div class="option-chevron">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 18l6-6-6-6" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      </div>

      <!-- Cancel option -->
      <div class="option-cancel" role="button" tabindex="0" aria-label="取消">
        <span class="option-cancel__label">取消</span>
      </div>

    </div>
  </div>


    <style>
    /* ===== Critical Layout CSS (static, non-Tailwind) ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }

    body {
      background-color: var(--tg-background);
      color: var(--tg-foreground);
      font-family: var(--tg-font-sans);
      min-height: 100vh;
      max-width: 100%;
      margin: 0;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Scrim / Backdrop overlay */
    .sheet-backdrop {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.4);
      z-index: 500;
    }

    /* Bottom sheet panel */
    .bottom-sheet {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 100%;
      height: 50vh;
      min-height: 340px;
      background-color: var(--tg-card);
      border-radius: var(--tg-radius-lg) var(--tg-radius-lg) 0 0;
      z-index: 600;
      display: flex;
      flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    /* Handle bar */
    .sheet-handle {
      display: flex;
      justify-content: center;
      padding: 12px 0 8px;
    }

    .sheet-handle__bar {
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background-color: var(--tg-neutral-300);
    }

    /* Sheet title */
    .sheet-title {
      text-align: center;
      font-size: var(--tg-text-lg);
      font-weight: var(--tg-weight-bold);
      color: var(--tg-foreground);
      padding-bottom: 8px;
    }

    /* Sheet spacer */
    .sheet-spacer {
      height: 16px;
    }

    /* Options container */
    .sheet-options {
      display: flex;
      flex-direction: column;
      padding: 0;
    }

    /* Single option row */
    .option-row {
      display: flex;
      align-items: center;
      min-height: 60px;
      padding: 12px 20px;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
      text-decoration: none;
      color: var(--tg-foreground);
      transition: transform 0.1s ease;
    }

    .option-row:active {
      transform: scale(0.97);
    }

    /* Option icon circle */
    .option-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--tg-msg-system);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-right: 16px;
    }

    /* Option label */
    .option-label {
      flex: 1;
      font-size: var(--tg-text-base);
      font-weight: var(--tg-weight-regular);
      color: var(--tg-foreground);
      line-height: var(--tg-leading-normal);
    }

    /* Option chevron */
    .option-chevron {
      flex-shrink: 0;
      margin-left: 8px;
    }

    /* Cancel option */
    .option-cancel {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px 20px;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
      border-top: 1px solid var(--tg-border);
      margin-top: auto;
    }

    .option-cancel:active {
      transform: scale(0.97);
    }

    .option-cancel__label {
      font-size: var(--tg-text-base);
      font-weight: var(--tg-weight-regular);
      color: var(--tg-muted-foreground);
    }

    /* Sheet body flex grow */
    .sheet-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    /* ===== Desktop responsive ===== */
    @media (min-width: 768px) {
      .sheet-backdrop {
        max-width: 100%;
      }
      .bottom-sheet {
        left: 50%;
        transform: translate(-50%, -50%);
        top: 50%;
        bottom: auto;
        width: auto;
        min-width: 400px;
        max-width: 480px;
        max-height: 80vh;
        border-radius: var(--tg-radius-lg);
        height: auto;
        min-height: auto;
      }
    }
  </style>
</body>
</html>
