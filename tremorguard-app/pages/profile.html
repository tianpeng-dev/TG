    <style id="theme-vars">
/* TremorGuard Brand Design System
   Healthcare-grade accessible design for Parkinson's patients
   Prefix: tg */

:root {
  /* ---- Primary Palette ---- */
  --tg-primary: #0F766E;
  --tg-primary-foreground: #FFFFFF;
  --tg-primary-light: #14B8A6;

  /* ---- Semantic State Colors ---- */
  --state-success: #059669;
  --state-success-foreground: #FFFFFF;
  --state-success-light: #ECFDF5;
  --state-warning: #D97706;
  --state-warning-foreground: #FFFFFF;
  --state-warning-light: #FFFBEB;
  --state-error: #DC2626;
  --state-error-foreground: #FFFFFF;
  --state-error-light: #FEF2F2;
  --state-info: #0891B2;
  --state-info-foreground: #FFFFFF;
  --state-info-light: #ECFEFF;

  /* ---- Neutral Scale ---- */
  --tg-neutral-50: #F8F9FB;
  --tg-neutral-100: #F1F3F5;
  --tg-neutral-200: #E5E7EB;
  --tg-neutral-300: #D1D5DB;
  --tg-neutral-400: #9CA3AF;
  --tg-neutral-500: #6B7280;
  --tg-neutral-600: #4B5563;
  --tg-neutral-700: #374151;
  --tg-neutral-800: #1F2937;
  --tg-neutral-900: #1A1D23;

  /* ---- Surface / Card Colors ---- */
  --tg-background: #F8F9FB;
  --tg-foreground: #1A1D23;
  --tg-card: #FFFFFF;
  --tg-card-foreground: #1A1D23;
  --tg-muted: #F1F3F5;
  --tg-muted-foreground: #6B7280;
  --tg-popover: #FFFFFF;
  --tg-popover-foreground: #1A1D23;
  --tg-border: #E5E7EB;
  --tg-input: #E5E7EB;
  --tg-ring: #0F766E;

  /* ---- Message Bubble Colors ---- */
  --tg-msg-system: #F0FDFA;
  --tg-msg-user: #ECFEFF;
  --tg-msg-alert: #FFFBEB;
  --tg-msg-confirmed: #ECFDF5;

  /* ---- Radius Scale ---- */
  --tg-radius-sm: 6px;
  --tg-radius-md: 12px;
  --tg-radius-lg: 16px;
  --tg-radius-full: 9999px;

  /* ---- Spacing ---- */
  --tg-spacing-xs: 4px;
  --tg-spacing-sm: 8px;
  --tg-spacing-md: 12px;
  --tg-spacing-lg: 16px;
  --tg-spacing-xl: 20px;
  --tg-spacing-2xl: 24px;

  /* ---- Typography ---- */
  --tg-font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --tg-font-mono: 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace;

  --tg-text-xs: 14px;
  --tg-text-sm: 16px;
  --tg-text-base: 18px;
  --tg-text-lg: 20px;
  --tg-text-xl: 24px;
  --tg-text-2xl: 28px;
  --tg-text-3xl: 32px;

  --tg-leading-tight: 1.3;
  --tg-leading-normal: 1.5;
  --tg-leading-relaxed: 1.7;

  --tg-weight-regular: 400;
  --tg-weight-medium: 500;
  --tg-weight-semibold: 600;
  --tg-weight-bold: 700;

  /* ---- Shadows (static: alpha <= 0.05; floating layers may exceed) ---- */
  --tg-shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --tg-shadow-md: 0 2px 8px rgba(0,0,0,0.05);
  --tg-shadow-floating: 0 8px 24px rgba(0,0,0,0.08);
  --tg-shadow-overlay: 0 16px 48px rgba(0,0,0,0.12);

  /* ---- Semantic Aliases for apply-html-head-contract ---- */
  --tg-background: #F8F9FB;
  --tg-foreground: #1A1D23;
  --tg-card: #FFFFFF;
  --tg-card-foreground: #1A1D23;
  --tg-popover: #FFFFFF;
  --tg-popover-foreground: #1A1D23;
  --tg-primary: #0F766E;
  --tg-primary-foreground: #FFFFFF;
  --tg-muted: #F1F3F5;
  --tg-muted-foreground: #6B7280;
  --tg-border: #E5E7EB;
  --tg-input: #E5E7EB;
  --tg-ring: #0F766E;
  --tg-radius-sm: 6px;
  --tg-radius-md: 12px;
  --tg-radius-lg: 16px;
  --tg-radius-full: 9999px;
}

/* ---- Typography Scale ---- */
.tg-text-xs { font-size: var(--tg-text-xs); line-height: var(--tg-leading-normal); font-weight: var(--tg-weight-regular); }
.tg-text-sm { font-size: var(--tg-text-sm); line-height: var(--tg-leading-normal); font-weight: var(--tg-weight-regular); }
.tg-text-base { font-size: var(--tg-text-base); line-height: var(--tg-leading-normal); font-weight: var(--tg-weight-regular); }
.tg-text-lg { font-size: var(--tg-text-lg); line-height: var(--tg-leading-tight); font-weight: var(--tg-weight-bold); }
.tg-text-xl { font-size: var(--tg-text-xl); line-height: var(--tg-leading-tight); font-weight: var(--tg-weight-bold); }

.tg-font-medium { font-weight: var(--tg-weight-medium); }
.tg-font-semibold { font-weight: var(--tg-weight-semibold); }
.tg-font-bold { font-weight: var(--tg-weight-bold); }

    </style>

<body>

  <!-- Status Bar Spacer -->

  <div class="profile-content-wrapper">
  <!-- Profile Header -->
  <div class="profile-header">
    <div class="avatar-circle">张</div>

    <div class="connection-badge">

    <style>
    body {
      background: var(--tg-background);
      min-height: 100vh;
      font-family: var(--tg-font-sans);
      color: var(--tg-foreground);
      -webkit-font-smoothing: antialiased;
      max-width: 100%;
      margin: 0;
      position: relative;
      overflow-x: hidden;
    }
    .status-bar-spacer {
      height: 44px;
      width: 100%;
      flex-shrink: 0;
    }
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--tg-spacing-2xl) var(--tg-spacing-xl) var(--tg-spacing-xl) var(--tg-spacing-xl);
      background: var(--tg-card);
    }
    .avatar-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--tg-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--tg-primary-foreground);
      font-size: var(--tg-text-xl);
      font-weight: var(--tg-weight-bold);
      margin-bottom: var(--tg-spacing-md);
    }
    .connection-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }
    .green-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--state-success);
      flex-shrink: 0;
    }
    .function-card {
      background: var(--tg-card);
      border-radius: var(--tg-radius-lg);
      box-shadow: var(--tg-shadow-sm);
      overflow: hidden;
    }
    .function-item {
      display: flex;
      align-items: center;
      padding: 0 var(--tg-spacing-xl);
      min-height: 56px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .function-item:active {
      background: var(--tg-muted);
    }
    .function-item + .function-item {
      border-top: 1px solid var(--tg-border);
    }
    .icon-circle {
      width: 44px;
      height: 44px;
      border-radius: var(--tg-radius-md);
      background: #F0FDFA;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: var(--tg-spacing-lg);
      flex-shrink: 0;
    }
    .function-label {
      flex: 1;
      font-size: var(--tg-text-base);
      font-weight: var(--tg-weight-medium);
      color: var(--tg-foreground);
    }
    .chevron {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }
    .bottom-tab-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 100%;
      height: 64px;
      background: var(--tg-card);
      border-top: 1px solid var(--tg-border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 40;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 64px;
      min-height: 48px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      border: none;
      background: transparent;
      padding: 4px 0;
    }
    .tab-item.active {
      color: var(--tg-primary);
    }
    .tab-item:not(.active) {
      color: var(--tg-neutral-400);
    }
    .tab-label {
      font-size: var(--tg-text-xs);
      margin-top: 2px;
    }
    .version-text {
      text-align: center;
      font-size: var(--tg-text-xs);
      color: var(--tg-neutral-400);
      padding: var(--tg-spacing-xl) 0 80px 0;
    }
    @media (min-width: 768px) {
      .bottom-tab-nav {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: 72px;
        height: 100% !important;
        max-width: 72px;
        flex-direction: column;
        justify-content: flex-start;
        padding-top: 24px;
        border-top: none;
        border-right: 1px solid var(--tg-border);
        transform: none;
        gap: 8px;
        z-index: 100;
      }
      .bottom-tab-nav .tab-label,
      .bottom-tab-nav .tab-item span {
        display: none;
      }
      .bottom-tab-nav .tab-item,
      .bottom-tab-nav .tab-item svg {
        width: 48px;
        height: 48px;
      }
      .profile-content-wrapper {
        margin-left: 72px;
        max-width: 648px;
        margin-right: auto;
        padding-left: 32px;
        padding-right: 32px;
      }
      .profile-header {
        flex-direction: row;
        gap: var(--tg-spacing-xl);
        align-items: center;
      }
      .avatar-circle {
        margin-bottom: 0;
      }
      .status-bar-spacer {
        display: none;
      }
      .version-text {
        padding-bottom: 32px;
      }
    }
  </style>
</body>
</html>
