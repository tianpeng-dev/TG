        <line x1="5" y1="12" x2="19" y2="12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--tg-background);
      min-height: 100vh;
      max-width: 100%;
      margin: 0;
      font-family: var(--tg-font-sans);
      color: var(--tg-foreground);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ===== Sidebar ===== */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 240px;
      background: var(--tg-card);
      border-right: 1px solid var(--tg-border);
      display: flex;
      flex-direction: column;
      z-index: 100;
      box-shadow: var(--tg-shadow-sm);
    }

    .sidebar__logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 28px 24px 32px;
      background: var(--tg-primary);
    }

    .sidebar__logo-text {
      font-size: var(--tg-text-lg);
      font-weight: var(--tg-weight-bold);
      color: var(--tg-primary-foreground);
      letter-spacing: -0.01em;
    }

    .sidebar__nav {
      flex: 1;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sidebar__nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: var(--tg-radius-md);
      text-decoration: none;
      font-size: var(--tg-text-base);
      font-weight: var(--tg-weight-medium);
      transition: background-color 0.15s ease, color 0.15s ease;
      cursor: pointer;
    }

    .sidebar__nav-item--inactive {
      color: var(--tg-muted-foreground);
    }

    .sidebar__nav-item--inactive:hover {
      background: var(--tg-muted);
      color: var(--tg-foreground);
    }

    .sidebar__nav-item--active {
      background: rgba(15, 118, 110, 0.08);
      color: var(--tg-primary);
    }

    .sidebar__nav-item--active:hover {
      background: rgba(15, 118, 110, 0.12);
    }

    .sidebar__user {
      padding: 20px 20px 28px;
      border-top: 1px solid var(--tg-border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sidebar__user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--tg-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sidebar__user-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .sidebar__user-name {
      font-size: var(--tg-text-base);
      font-weight: var(--tg-weight-medium);
      color: var(--tg-foreground);
    }

    .sidebar__user-status {
      font-size: var(--tg-text-sm);
      color: var(--tg-muted-foreground);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sidebar__user-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--state-success);
      flex-shrink: 0;
    }

    /* ===== Main Content ===== */
    .main-content {
      margin-left: 240px;
      padding: 32px;
    }

    /* ===== Page Header ===== */
    .page-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }

    .page-header__back {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: none;
      cursor: pointer;
      border-radius: var(--tg-radius-md);
      transition: background-color 0.15s ease;
      flex-shrink: 0;
    }

    .page-header__back:hover {
      background: var(--tg-muted);
    }

    .page-header__title {
      font-size: var(--tg-text-2xl);
      font-weight: var(--tg-weight-bold);
      color: var(--tg-foreground);
    }

    /* ===== Progress Card (horizontal) ===== */
    .progress-card {
      background: var(--tg-card);
      border-radius: var(--tg-radius-lg);
      padding: 32px;
      box-shadow: var(--tg-shadow-sm);
      display: flex;
      align-items: center;
      gap: 40px;
      margin-bottom: 28px;
    }

    .progress-card__left {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-shrink: 0;
    }

    .progress-card__label {
      font-size: var(--tg-text-lg);
      font-weight: var(--tg-weight-medium);
      color: var(--tg-muted-foreground);
      white-space: nowrap;
    }

    .progress-ring-container {
      position: relative;
      width: 120px;
      height: 120px;
      flex-shrink: 0;
    }

    .progress-ring-bg {
      fill: none;
      stroke: var(--tg-muted);
      stroke-width: 10;
    }

    .progress-ring-fg {
      fill: none;
      stroke: var(--tg-primary);
      stroke-width: 10;
      stroke-linecap: round;
      transform: rotate(-90deg);
      transform-origin: center;
      stroke-dasharray: 314;
      stroke-dashoffset: 125.6;
    }

    .progress-ring-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .progress-ring-value {
      font-size: var(--tg-text-2xl);
      font-weight: var(--tg-weight-bold);
      color: var(--tg-primary);
      line-height: 1;
    }

    .progress-card__divider {
      width: 1px;
      height: 80px;
      background: var(--tg-border);
      flex-shrink: 0;
    }

    .progress-card__right {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 48px;
      justify-content: center;
    }

    .progress-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .progress-stat__number {
      font-size: 32px;
      font-weight: var(--tg-weight-bold);
      color: var(--state-success);
      line-height: 1;
    }

    .progress-stat__number--amber {
      color: var(--state-warning);
    }

    .progress-stat__number--gray {
      color: var(--tg-neutral-400);
    }

    .progress-stat__label {
      font-size: var(--tg-text-sm);
      color: var(--tg-muted-foreground);
      font-weight: var(--tg-weight-medium);
    }

    /* ===== Medication Grid ===== */
    .medication-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 28px;
    }

    .medication-card {
      background: var(--tg-card);
      border-radius: var(--tg-radius-lg);
      padding: 20px 24px;
      box-shadow: var(--tg-shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transition: box-shadow 0.15s ease;
    }

    .medication-card:hover {
      box-shadow: var(--tg-shadow-md);
    }

    .medication-card__header {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .medication-card__name {
      font-size: var(--tg-text-lg);
      font-weight: var(--tg-weight-bold);
      color: var(--tg-foreground);
    }

    .medication-card__dose {
      font-size: var(--tg-text-sm);
