<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报告分享面板（桌面端） - TremorGuard</title>
    <style id="theme-vars">
:root {
  --tg-primary: #0F766E;
  --tg-primary-foreground: #FFFFFF;
  --tg-primary-light: #14B8A6;
  --state-success: #059669;
  --state-success-foreground: #FFFFFF;
  --state-success-light: #ECFDF5;
  --state-warning: #D97706;
  --state-warning-foreground: #FFFFFF;
  --state-warning-light: #FFFBEB;
  --state-error: #DC2626;
  --state-error-foreground: #FFFFFF;
  --state-error-light: #FEF2F2;
  --state-info: #0891B2;
  --tg-neutral-50: #F8F9FB;
  --tg-neutral-100: #F1F3F5;
  --tg-neutral-200: #E5E7EB;
  --tg-neutral-300: #D1D5DB;
  --tg-neutral-400: #9CA3AF;
  --tg-neutral-500: #6B7280;
  --tg-neutral-600: #4B5563;
  --tg-neutral-700: #374151;
  --tg-neutral-800: #1F2937;
  --tg-neutral-900: #1A1D23;
  --tg-background: #F8F9FB;
  --tg-foreground: #1A1D23;
  --tg-card: #FFFFFF;
  --tg-muted: #F1F3F5;
  --tg-muted-foreground: #6B7280;
  --tg-border: #E5E7EB;
  --tg-ring: #0F766E;
  --tg-radius-sm: 6px;
  --tg-radius-md: 12px;
  --tg-radius-lg: 16px;
  --tg-radius-full: 9999px;
  --tg-shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --tg-shadow-md: 0 2px 8px rgba(0,0,0,0.05);
  --tg-shadow-floating: 0 8px 24px rgba(0,0,0,0.08);
  --tg-shadow-overlay: 0 16px 48px rgba(0,0,0,0.12);
  --tg-font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --tg-text-sm: 14px;
  --tg-text-base: 16px;
  --tg-text-lg: 18px;
  --tg-text-xl: 20px;
  --tg-text-2xl: 24px;
  --tg-weight-regular: 400;
  --tg-weight-medium: 500;
  --tg-weight-bold: 700;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--tg-background);
    --color-foreground: var(--tg-foreground);
    --color-card: var(--tg-card);
    --color-card-foreground: var(--tg-card-foreground);
    --color-popover: var(--tg-popover);
    --color-popover-foreground: var(--tg-popover-foreground);
    --color-primary: var(--tg-primary);
    --color-primary-foreground: var(--tg-primary-foreground);
    --color-muted: var(--tg-muted);
    --color-muted-foreground: var(--tg-muted-foreground);
    --color-border: var(--tg-border);
    --color-input: var(--tg-input);
    --color-ring: var(--tg-ring);
    --radius-sm: var(--tg-radius-sm);
    --radius-md: var(--tg-radius-md);
    --radius-lg: var(--tg-radius-lg);
  }
  @layer base {
    body { background: var(--tg-background); color: var(--tg-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--tg-background); }

      .border-background { border-color: var(--tg-background); }

      .bg-popover-foreground { background-color: var(--tg-popover-foreground); }
      .text-popover-foreground { color: var(--tg-popover-foreground); }
      .border-popover-foreground { border-color: var(--tg-popover-foreground); }

      .bg-primary { background-color: var(--tg-primary); }
      .text-primary { color: var(--tg-primary); }
      .border-primary { border-color: var(--tg-primary); }

      .bg-primary-foreground { background-color: var(--tg-primary-foreground); }
      .text-primary-foreground { color: var(--tg-primary-foreground); }
      .border-primary-foreground { border-color: var(--tg-primary-foreground); }

    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <!-- Logo -->
    <div class="sidebar__logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <rect x="6" y="6" width="12" height="12" rx="3" stroke="#FFFFFF" stroke-width="2" fill="none"/>
        <path d="M10 6V4a2 2 0 0 1 2-2h0a2 2 0 0 1 2 2v2" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M10 18v2a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2v-2" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/>
        <circle cx="12" cy="12" r="2" fill="#FFFFFF"/>
      </svg>
      <span class="sidebar__logo-text">TremorGuard</span>
    </div>

    <!-- Navigation -->
    <nav class="sidebar__nav">
      <a href="#" class="sidebar__nav-item sidebar__nav-item--inactive">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 0 0 1 1h3m10-11l2 2m-2-2v10a1 1 0 0 1-1 1h-3m-4 0a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        <span>首页</span>
      </a>
      <a href="#" class="sidebar__nav-item sidebar__nav-item--inactive">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2 2v0a2 2 0 0 1-2 2H7v0h2M9 5v0a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v0a2 2 0 0 0 2 2h2v0M9 5h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <line x1="9" y1="12" x2="15" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="9" y1="16" x2="13" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>报告</span>
      </a>
      <a href="#" class="sidebar__nav-item sidebar__nav-item--inactive">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2" fill="none"/>
          <path d="M4 21v-1a6 6 0 0 1 12 0v1" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
        </svg>
        <span>我的</span>
      </a>
    </nav>

    <!-- User info at bottom -->
    <div class="sidebar__user">
      <div class="sidebar__user-avatar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="8" r="4" stroke="#FFFFFF" stroke-width="2" fill="none"/>
          <path d="M4 21v-1a6 6 0 0 1 12 0v1" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <div class="sidebar__user-info">
        <span class="sidebar__user-name">张秀兰</span>
        <span class="sidebar__user-status">
          <span class="sidebar__user-status-dot"></span>
          设备已连接
        </span>
      </div>
    </div>
  </aside>

  <!-- Main Content (backdrop covers this area) -->
  <main class="main-content">
    <!-- Semi-transparent backdrop covering only the content area -->
    <div class="sheet-backdrop" data-dom-id="sheet-backdrop"></div>

    <!-- Centered modal dialog -->
    <div class="share-modal" role="dialog" aria-label="分享报告" aria-modal="true">

      <!-- Handle bar (bottom sheet indicator style) -->
      <div class="share-modal__handle" aria-hidden="true">
        <div class="share-modal__handle-bar"></div>
      </div>

      <!-- Title -->
      <h2 class="share-modal__title">分享报告</h2>

      <!-- Sharing options -->
      <div class="share-modal__options">

        <!-- Option 1: SMS -->
        <div class="share-option" role="button" tabindex="0" aria-label="短信发送链接">
          <div class="share-option__icon">
            <!-- Message / SMS icon -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
          </div>
          <span class="share-option__label">短信发送链接</span>
          <div class="share-option__chevron">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 18l6-6-6-6" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
          </div>
        </div>

        <!-- Option 2: Email -->
        <div class="share-option" role="button" tabindex="0" aria-label="邮件发送 PDF">
          <div class="share-option__icon">
            <!-- Mail / Email icon -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="2" y="4" width="20" height="16" rx="3" stroke="#FFFFFF" stroke-width="2" fill="none"/>
              <path d="M22 7l-10 7L2 7" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
          </div>
          <span class="share-option__label">邮件发送 PDF</span>
          <div class="share-option__chevron">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 18l6-6-6-6" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
          </div>
        </div>

        <!-- Option 3: Print -->
        <div class="share-option" role="button" tabindex="0" aria-label="A4 打印">
          <div class="share-option__icon">
            <!-- Printer icon -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <polyline points="6 9 6 2 18 2 18 9" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              <rect x="6" y="14" width="12" height="8" rx="1" stroke="#FFFFFF" stroke-width="2" fill="none"/>
            </svg>
          </div>
          <span class="share-option__label">A4 打印</span>
          <div class="share-option__chevron">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 18l6-6-6-6" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
          </div>
        </div>

      </div>

      <!-- Cancel option (separated by border) -->
      <div class="share-cancel" role="button" tabindex="0" aria-label="取消">
        <span class="share-cancel__label">取消</span>
      </div>

    </div>
  </main>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--tg-background);
      min-height: 100vh;
      max-width: 100%;
      margin: 0;
      font-family: var(--tg-font-sans);
      color: var(--tg-foreground);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ===== Sidebar (matches medication.html pattern) ===== */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 240px;
      background: var(--tg-card);
      border-right: 1px solid var(--tg-border);
      display: flex;
      flex-direction: column;
      z-index: 100;
      box-shadow: var(--tg-shadow-sm);
    }

    .sidebar__logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 28px 24px 32px;
      background: var(--tg-primary);
    }

    .sidebar__logo-text {
      font-size: var(--tg-text-lg);
      font-weight: var(--tg-weight-bold);
      color: var(--tg-primary-foreground);
      letter-spacing: -0.01em;
    }

    .sidebar__nav {
      flex: 1;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sidebar__nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: var(--tg-radius-md);
      text-decoration: none;
      font-size: var(--tg-text-base);
      font-weight: var(--tg-weight-medium);
      transition: background-color 0.15s ease, color 0.15s ease;
      cursor: pointer;
    }

    .sidebar__nav-item--inactive {
      color: var(--tg-muted-foreground);
    }

    .sidebar__nav-item--inactive:hover {
      background: var(--tg-muted);
      color: var(--tg-foreground);
    }

    .sidebar__user {
      padding: 20px 20px 28px;
      border-top: 1px solid var(--tg-border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sidebar__user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--tg-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sidebar__user-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .sidebar__user-name {
      font-size: var(--tg-text-base);
      font-weight: var(--tg-weight-medium);
      color: var(--tg-foreground);
    }

    .sidebar__user-status {
      font-size: var(--tg-text-sm);
      color: var(--tg-muted-foreground);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sidebar__user-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--state-success);
      flex-shrink: 0;
    }

    /* ===== Main Content ===== */
    .main-content {
      margin-left: 240px;
      padding: 32px;
      position: relative;
      min-height: 100vh;
    }

    /* ===== Sheet Backdrop ===== */
    .sheet-backdrop {
      position: fixed;
      top: 0;
      left: 240px;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.4);
      z-index: 500;
    }

    /* ===== Share Modal ===== */
    .share-modal {
      position: fixed;
      top: 50%;
      left: calc(240px + (100% - 240px) / 2);
      transform: translate(-50%, -50%);
      width: 480px;
      background-color: var(--tg-card);
      border-radius: var(--tg-radius-lg);
      box-shadow: var(--tg-shadow-overlay);
      z-index: 600;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ===== Handle Bar ===== */
    .share-modal__handle {
      display: flex;
      justify-content: center;
      padding: 14px 0 8px;
    }

    .share-modal__handle-bar {
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background-color: var(--tg-neutral-300);
    }

    /* ===== Modal Title ===== */
    .share-modal__title {
      text-align: center;
      font-size: var(--tg-text-xl);
      font-weight: var(--tg-weight-bold);
      color: var(--tg-foreground);
      padding-bottom: 8px;
    }

    /* ===== Sharing Options ===== */
    .share-modal__options {
      display: flex;
      flex-direction: column;
      padding: 8px 0 0 0;
    }

    /* ===== Single Share Option Row ===== */
    .share-option {
      display: flex;
      align-items: center;
      min-height: 56px;
      padding: 10px 24px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      text-decoration: none;
      color: var(--tg-foreground);
      transition: background-color 0.15s ease;
    }

    .share-option:hover {
      background-color: var(--tg-muted);
    }

    .share-option:active {
      background-color: var(--tg-neutral-200);
    }

    /* ===== Option Icon Circle ===== */
    .share-option__icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--tg-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-right: 16px;
    }

    /* ===== Option Label ===== */
    .share-option__label {
      flex: 1;
      font-size: var(--tg-text-base);
      font-weight: var(--tg-weight-regular);
      color: var(--tg-foreground);
      line-height: 1.5;
    }

    /* ===== Option Chevron ===== */
    .share-option__chevron {
      flex-shrink: 0;
      margin-left: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== Cancel Option ===== */
    .share-cancel {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 12px 24px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      border-top: 1px solid var(--tg-border);
      margin-top: 4px;
      transition: background-color 0.15s ease;
    }

    .share-cancel:hover {
      background-color: var(--tg-muted);
    }

    .share-cancel:active {
      background-color: var(--tg-neutral-200);
    }

    .share-cancel__label {
      font-size: var(--tg-text-base);
      font-weight: var(--tg-weight-regular);
      color: var(--tg-muted-foreground);
    }
  </style>
</body>
</html>
